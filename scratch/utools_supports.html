<!DOCTYPE html>

    <title>Page Not Found</title>

    <style media="screen">
/* Base styles */
body {
  margin: 0;
  padding: 0;
  background-color: #111827;
  color: #f3f4f6;
  font-family: system-ui, -apple-system, sans-serif;
}

/* Container and layout */
.container {
  min-height: 100vh;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.content {
  max-width: 42rem;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

/* Decorative elements */
.decorative-line {
  width: 8rem;
  height: 1px;
  margin: 0 auto;
  background: linear-gradient(90deg, transparent, #a855f7, transparent);
}

/* Error code styling */
.error-code {
  position: relative;
}

.error-base {
  font-size: 9rem;
  font-weight: bold;
  color: #1f2937;
  margin: 0;
}

.error-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9rem;
  font-weight: bold;
  margin: 0;
  background: linear-gradient(90deg, #a78bfa, #ec4899);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  opacity: 0.75;
}

/* Ghost icon styling */
.ghost-container {
  position: relative;
  width: fit-content;
  margin: 0 auto;
}

.ghost-icon {
  width: 5rem;
  height: 5rem;
  color: #a78bfa;
  animation: float 3s ease-in-out infinite;
}

.ghost-glow {
  position: absolute;
  inset: 0;
  background-color: rgba(168, 85, 247, 0.2);
  filter: blur(1rem);
  border-radius: 50%;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Message styling */
.message {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message h2 {
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  margin: 0;
}

.message p {
  color: #9ca3af;
  margin: 0;
}

/* Back button styling */
.back-button {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: #a78bfa;
  border: 1px solid rgba(168, 85, 247, 0.3);
  border-radius: 9999px;
  text-decoration: none;
  transition: all 0.3s ease;
  margin: 1rem auto;
  width: fit-content;
}

.back-button:hover {
  background-color: rgba(168, 85, 247, 0.1);
  transform: scale(1.05);
}

.arrow-icon {
  width: 1rem;
  height: 1rem;
}
    </style>

    <div class="container">

        <div class="error-code">

        </a>

        <div class="decorative-line"></div>
      </div>
